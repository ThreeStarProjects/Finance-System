<style>
/* ============================================================
   Three Star Projects — Finance System
   Palette: 3SP brand (blue · teal · orange · red-orange · white · light gray)
   Type:   Inter everywhere for maximum on-screen readability
   ============================================================ */

/* Webfonts — Inter (body + display) + JetBrains Mono (code / numbers) */
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap');

/* ─── Tokens ─────────────────────────────────────────────── */
:root {
  /* 3SP brand palette */
  --blue:         #1F4E79;   /* Primary Blue */
  --blue-deep:    #163A5A;   /* darker shade for hovers */
  --teal:         #2C7DA0;   /* Teal Blue */
  --teal-soft:    #4A97B8;
  --orange:       #F47C2C;   /* Bright Orange */
  --orange-soft:  #F69552;
  --redorange:    #E94E1B;   /* Red-Orange */
  --white:        #FFFFFF;
  --gray-bg:      #E6E6E6;   /* Light Gray background */
  --gray-line:    #D2D6DB;
  --gray-line-2:  #E1E4E8;

  /* Ink / text tones (kept as neutral slate-blues to match brand) */
  --ink:          #16263A;
  --ink-soft:     #33475B;
  --ink-muted:    #6B7A89;

  /* Status */
  --mint:         #1B8A4B;
  --mint-wash:    #E2F4EA;
  --rust:         #E94E1B;
  --rust-wash:    #FDE7DF;
  --amber:        #B45309;
  --amber-wash:   #FEF3C7;

  /* Semantic — same names as before, remapped to brand */
  --bg:           var(--gray-bg);
  --surface:      #FFFFFF;
  --surface-2:    #F2F4F6;
  --surface-3:    #E9ECEF;
  --text:         var(--ink);
  --text-soft:    var(--ink-soft);
  --text-muted:   var(--ink-muted);
  --accent:       var(--orange);
  --accent-fg:    #FFFFFF;
  --primary:      var(--blue);
  --primary-fg:   #FFFFFF;
  --rule:         var(--gray-line);
  --rule-strong:  var(--blue);

  /* Aliases for older rules that referenced paper/ink/ember/slate */
  --paper:        #FFFFFF;
  --paper-deep:   #F2F4F6;
  --paper-edge:   #E9ECEF;
  --pencil:       var(--gray-line);
  --pencil-soft:  var(--gray-line-2);
  --slate:        var(--blue);
  --slate-soft:   var(--teal);
  --ember:        var(--orange);
  --ember-soft:   var(--redorange);
  --ember-wash:   #FEEDE0;
  --c-primary:    var(--blue);

  /* Typography — Inter everywhere; serif Fraunces removed for readability */
  --f-display:    'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --f-body:       'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --f-mono:       'JetBrains Mono', 'SF Mono', Menlo, monospace;

  /* Spacing — 6px base */
  --sp-1:  6px;
  --sp-2:  12px;
  --sp-3:  18px;
  --sp-4:  24px;
  --sp-5:  36px;
  --sp-6:  48px;
  --sp-7:  72px;

  /* Radius */
  --r-sm:  4px;
  --r-md:  7px;
  --r-lg:  12px;

  /* Elevation */
  --shadow-sm:   0 1px 2px rgba(31,78,121,0.06);
  --shadow-md:   0 2px 8px rgba(31,78,121,0.10), 0 1px 2px rgba(31,78,121,0.06);
  --shadow-lg:   0 14px 36px rgba(22,38,58,0.18), 0 2px 8px rgba(22,38,58,0.08);
  --ring:        0 0 0 3px rgba(244,124,44,0.30);

  /* Motion */
  --ease:        cubic-bezier(.2,.7,.3,1);
  --d-fast:      120ms;
  --d-base:      240ms;
  --d-slow:      460ms;
}

/* ─── Base ───────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { margin: 0; padding: 0; overflow-x: hidden; }
body {
  font-family: var(--f-body);
  font-size: 14px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: 'ss01', 'cv11';   /* Inter stylistic sets */
}
::selection { background: var(--ember); color: white; }

/* ─── Typography ─────────────────────────────────────────── */
h1, h2, h3, h4 {
  font-family: var(--f-display);
  font-weight: 500;
  letter-spacing: -0.015em;
  color: var(--text);
  margin: 0;
}
h1 { font-size: 28px; line-height: 1.15; font-variation-settings: 'opsz' 90; }
h2 { font-size: 20px; line-height: 1.25; font-variation-settings: 'opsz' 32; }
h3 { font-size: 16px; line-height: 1.3;  font-variation-settings: 'opsz' 24; font-weight: 600; }
.small { font-size: 12px; }
.muted { color: var(--text-muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ─── Skip link ──────────────────────────────────────────── */
.skip-link{ position:absolute; top:-50px; left:8px; background:var(--ember); color:#fff;
  padding:8px 16px; border-radius:var(--r-sm); z-index:1000; }
.skip-link:focus{ top:8px; }

/* ─── App shell ──────────────────────────────────────────── */
.app{ display:flex; flex-direction:column; min-height:100vh; }
/* Ensure sticky nav works regardless of parent layout quirks */
.app__topbar, .tabs { position: -webkit-sticky; position: sticky; }
.app__topbar { top: 0; z-index: 60; }
.tabs { top: 64px; z-index: 55; }

/* ─── Topbar ─────────────────────────────────────────────── */
.app__topbar{
  /* Brand blue gradient — primary → deeper on the right for depth */
  background: linear-gradient(90deg, var(--blue) 0%, var(--blue-deep) 100%);
  color: var(--paper);
  padding: 14px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: var(--sp-3);
  position: sticky;
  top: 0;
  z-index: 50;
  border-bottom: 1px solid var(--blue-deep);
  position: relative;
}
/* Signature: tick-mark ruler under the topbar */
.app__topbar::after{
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: -1px;
  height: 5px;
  background-image:
    linear-gradient(to right, var(--ember) 1px, transparent 1px),
    linear-gradient(to right, var(--pencil) 1px, transparent 1px);
  background-size: 60px 100%, 12px 100%;
  background-position: 24px bottom, 24px bottom;
  background-repeat: repeat-x;
  opacity: 0;
  animation: tickRevealIn 700ms var(--ease) 80ms forwards;
  pointer-events:none;
}
@keyframes tickRevealIn{
  from { opacity: 0; transform: scaleX(0); transform-origin: left; }
  to   { opacity: 1; transform: scaleX(1); transform-origin: left; }
}

.app__brand{ display:flex; align-items:center; gap: var(--sp-2); min-width:0; }
.app__brand-mark{
  width: 36px; height: 36px;
  border-radius: var(--r-sm);
  background: var(--paper);
  color: var(--blue);          /* brand blue "3" on white tile */
  display:grid; place-items:center;
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 18px;
  flex-shrink: 0;
  position: relative;
  box-shadow: 0 1px 2px rgba(15,30,55,.18);
}
.app__brand-mark::after{
  content: '';
  position: absolute;
  right: -3px; top: 4px; bottom: 4px;
  width: 2px;
  background: var(--ember);    /* brand orange tick, kept */
  border-radius: 1px;
}
.app__brand-text{
  font-family: var(--f-display);
  font-weight: 500;
  font-size: 17px;
  font-variation-settings: 'opsz' 24;
  white-space: nowrap;
  letter-spacing: -0.01em;
}
.app__brand-sub{
  font-size: 11px;
  opacity: .7;
  margin-top: -2px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  font-weight: 500;
}

.app__topbar-actions{ display:flex; gap: var(--sp-2); align-items:center; }
.app__topbar-fy{
  background: transparent;
  color: var(--paper);
  border: 1px solid rgba(229, 226, 216, 0.25);
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-family: var(--f-mono);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.topbar__badge{
  background: transparent;
  color: var(--paper);
  border: 1px solid rgba(229, 226, 216, 0.25);
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-size: 12px;
  font-weight: 500;
  transition: all var(--d-fast) var(--ease);
  text-decoration: none;
  display: inline-block;
}
.topbar__badge:hover{
  background: rgba(229, 226, 216, 0.10);
  border-color: rgba(229, 226, 216, 0.45);
}
.theme-toggle{
  background: transparent;
  border: 1px solid rgba(229, 226, 216, 0.25);
  color: var(--paper);
  padding: 6px 12px;
  border-radius: var(--r-sm);
  font-size: 12px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all var(--d-fast) var(--ease);
}
.theme-toggle:hover{ background: rgba(229, 226, 216, 0.10); border-color: rgba(229, 226, 216, 0.45); }
.theme-toggle svg{ width: 13px; height: 13px; }

/* ─── Primary tabs ───────────────────────────────────────── */
.tabs{
  background: var(--surface);
  border-bottom: 1px solid var(--rule);
  padding: 0 var(--sp-4);
  display: flex;
  gap: 4px;
  overflow-x: auto;
  position: sticky;
  top: 64px;
  z-index: 40;
  scrollbar-width: none;
}
.tabs::-webkit-scrollbar{ display: none; }
.tab{
  padding: 16px 18px;
  font-family: var(--f-body);
  font-size: 13px;
  font-weight: 500;
  letter-spacing: -0.005em;
  color: var(--text-muted);
  border: none;
  background: transparent;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  transition: color var(--d-fast) var(--ease);
  /* Icon + label row */
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
.tab svg{ width: 16px; height: 16px; stroke-width: 2; opacity: .85; }
.tab.is-active svg{ opacity: 1; color: var(--blue); }
.tab:hover{ color: var(--text); }
.tab.is-active{ color: var(--text); }
.tab.is-active::after{
  content: '';
  position: absolute;
  left: 18px; right: 18px;
  bottom: -1px;
  height: 2px;
  background: var(--ember);
  border-radius: 1px;
  animation: tabUnderlineIn var(--d-base) var(--ease);
}
.tab.is-active::before{
  content: '';
  position: absolute;
  left: 50%; top: 8px;
  transform: translateX(-50%);
  width: 3px; height: 3px;
  background: var(--ember);
  border-radius: 50%;
}
@keyframes tabUnderlineIn{
  from { transform: scaleX(0); opacity: 0; }
  to   { transform: scaleX(1); opacity: 1; }
}

/* ─── Panel ──────────────────────────────────────────────── */
.panel{
  display: none;
  padding: var(--sp-4);
  max-width: 1600px;
  margin: 0 auto;
  width: 100%;
  box-sizing: border-box;
}
.panel.is-active{
  display: block;
  animation: panelIn var(--d-base) var(--ease);
}
@keyframes panelIn{
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}
.panel__head{
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  padding-bottom: var(--sp-3);
  border-bottom: 1px solid var(--rule);
  position: relative;
}
.panel__head::after{
  content: '';
  position: absolute;
  left: 0;
  bottom: -1px;
  width: 32px;
  height: 2px;
  background: var(--ember);
}
.panel__title{
  font-family: var(--f-display);
  font-weight: 700;
  font-size: 30px;
  line-height: 1;
  margin: 0;
  letter-spacing: -0.02em;
  /* Brand-blue accent bar on the left — "hero banner" cue */
  padding-left: 14px;
  border-left: 4px solid var(--blue);
}
.panel__sub{
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 6px;
  letter-spacing: 0;
}

/* ─── Sub-tabs (segmented) ───────────────────────────────── */
.tabnav{
  display: inline-flex;
  gap: 0;
  padding: 0;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-3);
  overflow: hidden;
}
.tabnav__btn{
  padding: 9px 16px;
  font-family: var(--f-body);
  font-size: 13px;
  font-weight: 500;
  color: var(--text-muted);
  background: transparent;
  border: none;
  border-right: 1px solid var(--rule);
  cursor: pointer;
  transition: all var(--d-fast) var(--ease);
  position: relative;
}
.tabnav__btn:last-child{ border-right: none; }
.tabnav__btn:hover{ color: var(--text); background: var(--surface-2); }
.tabnav__btn.is-active{
  color: var(--text);
  background: var(--surface-2);
  font-weight: 600;
}
.tabnav__btn.is-active::after{
  content: '';
  position: absolute;
  left: 14px; right: 14px;
  bottom: 0; height: 2px;
  background: var(--ember);
}
.tabpane{ display: none; }
.tabpane.is-active{ display: block; animation: panelIn var(--d-base) var(--ease); }

/* ─── Card ───────────────────────────────────────────────── */
.card{
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: var(--sp-4);
  box-shadow: var(--shadow-sm);
  position: relative;
}
.card + .card{ margin-top: var(--sp-3); }
.card__title{
  font-family: var(--f-body);
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-bottom: var(--sp-3);
  display: flex;
  align-items: center;
  gap: var(--sp-2);
}
.card__title::before{
  content: '';
  width: 12px;
  height: 1px;
  background: var(--ember);
  flex-shrink: 0;
}
.card__title-row{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  flex-wrap: wrap;
  margin-bottom: var(--sp-3);
}
.card__title-row .card__title{ margin-bottom: 0; }

/* ─── Grid ───────────────────────────────────────────────── */
.grid-2{ display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-3); }
.grid-3{ display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-3); }

/* ─── Forms ──────────────────────────────────────────────── */
.field{ margin-bottom: var(--sp-3); }
.field label, .label{
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  margin-bottom: 6px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.input, .select, .textarea{
  width: 100%;
  min-height: 38px;
  padding: 8px 12px;
  background: var(--surface);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 14px;
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  transition: border-color var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease);
}
.input.mono, .input[type="number"]{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.textarea{ min-height: 80px; font-family: var(--f-body); resize: vertical; }
.input:hover, .select:hover, .textarea:hover{ border-color: var(--text-muted); }
.input:focus, .select:focus, .textarea:focus{ border-color: var(--ember); box-shadow: var(--ring); outline: none; }

/* ─── Button ─────────────────────────────────────────────── */
.btn{
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 9px 18px;
  font-family: var(--f-body);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: -0.005em;
  background: var(--blue);
  color: var(--paper);
  border: 1px solid var(--blue);
  border-radius: var(--r-sm);
  cursor: pointer;
  transition: transform var(--d-fast) var(--ease), box-shadow var(--d-fast) var(--ease), background var(--d-fast) var(--ease);
  min-height: 38px;
  position: relative;
}
.btn:hover{
  background: var(--blue-deep);
  border-color: var(--slate);
  transform: translateY(-1px);
  box-shadow: var(--shadow-md);
}
.btn:active{ transform: translateY(0); box-shadow: var(--shadow-sm); }
.btn:focus-visible{ outline: none; box-shadow: var(--ring); }
.btn:disabled{ opacity: 0.5; cursor: not-allowed; transform: none; }

.btn--ghost{
  background: var(--surface);
  color: var(--text);
  border-color: var(--rule);
}
.btn--ghost:hover{ background: var(--surface-2); border-color: var(--text-muted); color: var(--text); }

.btn--accent{
  background: var(--ember);
  color: var(--accent-fg);
  border-color: var(--ember);
}
.btn--accent:hover{ background: var(--ember-soft); border-color: var(--ember-soft); }

.btn--danger{
  background: var(--rust);
  color: white;
  border-color: var(--rust);
}
.btn--danger:hover{ background: #B91C1C; border-color: #B91C1C; }

.btn--xs{ padding: 4px 10px; font-size: 12px; min-height: 28px; }

.btn--good{
  background: var(--surface);
  color: var(--mint);
  border-color: var(--mint);
}
.btn--good:hover{
  background: var(--mint-wash);
  color: var(--mint);
}

/* Pending Settlements table description column — keep narrow + truncate */
.ds-desc{
  max-width: 320px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

/* ─── Filter bar ─────────────────────────────────────────── */
.filterbar{
  display: flex;
  gap: var(--sp-2);
  align-items: center;
  flex-wrap: wrap;
  padding: var(--sp-2) var(--sp-3);
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  margin-bottom: var(--sp-3);
}
.filterbar > * { flex: 0 0 auto; }
.filterbar .input, .filterbar .select{
  min-height: 32px; padding: 5px 10px; font-size: 12px; min-width: 120px;
}
.filterbar__search{ flex: 1 1 240px; min-width: 200px; }
.filterbar__sep{ width: 1px; height: 20px; background: var(--rule); margin: 0 var(--sp-1); }
.filterbar__status{
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--text-muted);
  margin-left: auto;
  padding: 0 var(--sp-2);
  letter-spacing: 0.02em;
}

/* ─── Data table ─────────────────────────────────────────── */
.tablewrap{
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  overflow: auto;
  max-width: 100%;
}
.table{
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
.table th{
  background: var(--surface-2);
  padding: 10px 14px;
  text-align: left;
  font-family: var(--f-body);
  font-weight: 600;
  font-size: 10px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  border-bottom: 1px solid var(--rule);
  position: sticky;
  top: 0;
  z-index: 1;
  white-space: nowrap;
}
.table th[data-sort]{ cursor: pointer; user-select: none; transition: color var(--d-fast) var(--ease); }
.table th[data-sort]:hover{ color: var(--ember); }
.table th[data-sort]::after{
  content: '';
  display: inline-block;
  margin-left: 5px;
  opacity: 0.25;
  border-style: solid;
  border-width: 4px 3px 0 3px;
  border-color: currentColor transparent transparent transparent;
  transition: transform var(--d-fast) var(--ease), opacity var(--d-fast) var(--ease);
}
.table th.th-asc::after{ opacity: 1; transform: rotate(180deg); }
.table th.th-desc::after{ opacity: 1; }
.table td{
  padding: 11px 14px;
  border-bottom: 1px solid var(--pencil-soft);
  vertical-align: top;
  color: var(--text-soft);
  position: relative;
}
.table tr:last-child td{ border-bottom: none; }
.table tr{ transition: background var(--d-fast) var(--ease); }
.table tr:hover td{ background: var(--surface-2); }
.table tr:hover td:first-child::before{
  content: '';
  position: absolute;
  left: 4px; top: 50%; transform: translateY(-50%);
  width: 6px; height: 1px;
  background: var(--ember);
}
.table tr.is-selected td{ background: var(--ember-wash); }
.table tr.is-selected td:first-child::before{
  content: '';
  position: absolute;
  left: 4px; top: 50%; transform: translateY(-50%);
  width: 6px; height: 2px;
  background: var(--ember);
}
.table th.num{ text-align: right; padding-right: 12px; }

/* Click-to-sort: every .table th is clickable unless col-actions or [data-nosort].
   Custom-wired columns already use [data-sort] and get their own arrows above. */
.table thead th:not(.col-actions):not([data-nosort]):not([data-sort]){
  cursor: pointer; user-select: none;
  transition: color var(--d-fast) var(--ease);
}
.table thead th:not(.col-actions):not([data-nosort]):not([data-sort]):hover{ color: var(--ember); }
.table th[data-sort-dir="asc"]::after{ content: " \25B2"; opacity: .55; font-size: .8em; }
.table th[data-sort-dir="desc"]::after{ content: " \25BC"; opacity: .55; font-size: .8em; }
.table td.num{
  text-align: right;
  font-family: var(--f-mono);
  font-variant-numeric: tabular-nums;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  white-space: nowrap;
}
.table td.center{ text-align: center; }
.table td.muted{ color: var(--text-muted); }
.table .col-actions{ width: 1%; white-space: nowrap; text-align: right; }
.table .row-edit-btn{ font-size: 11px; padding: 3px 9px; min-height: 24px; }
.table__empty{
  padding: var(--sp-6);
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
  font-family: var(--f-body);
}
.table__empty::before{
  content: '— —';
  display: block;
  color: var(--rule-strong);
  font-family: var(--f-mono);
  letter-spacing: 0.3em;
  margin-bottom: var(--sp-2);
}

/* ─── Pagination ─────────────────────────────────────────── */
.pager{
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  justify-content: flex-end;
  padding: var(--sp-3) 0;
  font-family: var(--f-mono);
  font-size: 11px;
  color: var(--text-muted);
  letter-spacing: 0.02em;
}
.pager__btn{
  padding: 5px 12px;
  border: 1px solid var(--rule);
  background: var(--surface);
  border-radius: var(--r-sm);
  cursor: pointer;
  font-family: var(--f-body);
  font-size: 12px;
  font-weight: 500;
  color: var(--text);
  transition: all var(--d-fast) var(--ease);
}
.pager__btn:hover:not(:disabled){ background: var(--surface-2); border-color: var(--text-muted); }
.pager__btn:disabled{ opacity: 0.35; cursor: not-allowed; }
.pager__info{ padding: 0 var(--sp-2); }

/* ─── Status pill ────────────────────────────────────────── */
.pill{
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 8px;
  border-radius: 2px;
  font-family: var(--f-body);
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.pill::before{
  content: '';
  width: 4px; height: 4px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.6;
}
.pill--success{ background: var(--mint-wash); color: var(--mint); }
.pill--warning{ background: var(--amber-wash); color: var(--amber); }
.pill--danger{ background: var(--rust-wash); color: var(--rust); }
.pill--info{ background: var(--ember-wash); color: var(--ember); }
.pill--muted{ background: var(--surface-2); color: var(--text-muted); }

/* ─── KPI cards ──────────────────────────────────────────── */
.kpi-grid{
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
}
/* Dashboard uses a fixed 3-column layout on medium+ screens so the 9 KPI
   cards land as a clean 3x3 grid. Below 900px, revert to auto-fit so cards
   don't get too narrow. */
@media (min-width: 900px){
  #dash-kpis{ grid-template-columns: repeat(3, 1fr); }
}
.kpi{
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: var(--sp-4);
  position: relative;
  overflow: hidden;
  transition: transform var(--d-base) var(--ease), box-shadow var(--d-base) var(--ease);
}
/* Icon-tile layout only when the card actually has an icon badge, so legacy
   KPI cards without .kpi__icon (Projects / Salary / Monthly Close) keep
   stacking their label-value-sub vertically. */
.kpi:has(.kpi__icon){
  display: flex;
  align-items: flex-start;
  gap: var(--sp-3);
}
.kpi:hover{
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}
/* Left accent bar — kept for KPI cards that don't have an icon badge
   (Projects / Salary / Monthly Close panels). Dashboard tiles have icons
   and get this bar suppressed so the icon is the only visual anchor. */
.kpi::before{
  content: '';
  position: absolute;
  left: 0; top: 16px;
  width: 4px; height: 24px;
  background: var(--blue);
  border-radius: 0 2px 2px 0;
}
.kpi:has(.kpi__icon)::before{ display: none; }
/* Status variants tint whichever anchor exists (bar on legacy cards, icon on new ones) */
.kpi--good::before{ background: var(--mint); }
.kpi--bad::before{  background: var(--rust); }
.kpi--warn::before{ background: var(--ember); }

/* Icon badge — one of five brand variants, white glyph */
.kpi__icon{
  width: 44px; height: 44px;
  border-radius: 10px;
  display: grid; place-items: center;
  color: #fff;
  flex-shrink: 0;
  box-shadow: 0 1px 2px rgba(15,30,55,.12);
}
.kpi__icon svg{ width: 22px; height: 22px; stroke-width: 2; }
.kpi__icon--blue      { background: var(--blue); }
.kpi__icon--teal      { background: var(--teal); }
.kpi__icon--orange    { background: var(--orange); }
.kpi__icon--redorange { background: var(--redorange); }
.kpi__icon--mint      { background: var(--mint); }

.kpi__body{ flex: 1; min-width: 0; }
/* Status variants now tint the icon border instead of the left bar */
.kpi--good .kpi__icon{ background: var(--mint); }
.kpi--bad  .kpi__icon{ background: var(--rust); }
.kpi--warn .kpi__icon{ background: var(--ember); }

.kpi__label{
  font-family: var(--f-body);
  font-size: 10px;
  font-weight: 600;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.kpi__value{
  font-family: var(--f-display);
  font-variation-settings: 'opsz' 90;
  font-weight: 500;
  font-size: 32px;
  line-height: 1.1;
  margin-top: var(--sp-2);
  color: var(--text);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  position: relative;
  display: inline-block;
}
/* The signature tick mark next to the big number */
.kpi__value::after{
  content: '';
  position: absolute;
  right: -10px; top: 8px;
  width: 1px;
  height: 14px;
  background: var(--ember);
  opacity: 0;
  animation: tickDown 360ms var(--ease) 280ms forwards;
}
@keyframes tickDown{
  from { opacity: 0; transform: scaleY(0); transform-origin: top; }
  to   { opacity: 1; transform: scaleY(1); transform-origin: top; }
}
.kpi__sub{
  font-size: 11px;
  color: var(--text-muted);
  margin-top: var(--sp-1);
  font-family: var(--f-mono);
  letter-spacing: 0.02em;
}

/* Reconciliation block below a KPI tile — proper English bullets, cause→effect
   arrows, no opacity fading. Numbers stay in a mono-ish feel via tabular-nums
   while prose uses the body sans-serif. */
.kpi__recon{
  margin-top: 8px;
  font-family: var(--f-body);
  font-size: 12px;
  line-height: 1.55;
  color: var(--text);
  font-variant-numeric: tabular-nums;
}
.kpi__recon__row{
  display: flex;
  gap: 6px;
  align-items: baseline;
  padding: 1px 0;
}
.kpi__recon__row > .b{ color: var(--text-muted); flex: 0 0 10px; }
.kpi__recon__row.total{ font-weight: 600; border-top: 1px dashed var(--border, #d8dadf); padding-top: 4px; margin-top: 2px; }
.kpi__recon__note{
  margin-top: 6px;
  padding-top: 6px;
  border-top: 1px dashed var(--border, #d8dadf);
  color: var(--text-soft);
  font-size: 11.5px;
}
.kpi__recon__arrow{ color: var(--text-muted); margin: 0 2px; }

/* ─── Modal ──────────────────────────────────────────────── */
.modal{
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(14, 17, 22, 0.6);
  backdrop-filter: blur(2px);
  -webkit-backdrop-filter: blur(2px);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: var(--sp-3);
  animation: modalBgIn var(--d-fast) var(--ease);
}
@keyframes modalBgIn{ from { opacity: 0; } to { opacity: 1; } }
.modal.is-open{ display: flex; }
.modal__panel{
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-md);
  padding: var(--sp-5);
  max-width: 560px;
  width: 100%;
  max-height: 90vh;
  overflow: auto;
  box-shadow: var(--shadow-lg);
  position: relative;
  animation: modalPanelIn var(--d-base) var(--ease);
}
@keyframes modalPanelIn{
  from { opacity: 0; transform: scale(0.96) translateY(8px); }
  to   { opacity: 1; transform: scale(1) translateY(0); }
}
.modal__panel::before{
  content: '';
  position: absolute;
  left: var(--sp-5); top: 0;
  width: 32px; height: 2px;
  background: var(--ember);
}
.modal__close{
  position: absolute;
  top: var(--sp-3); right: var(--sp-3);
  background: transparent;
  border: none;
  font-size: 22px;
  cursor: pointer;
  color: var(--text-muted);
  padding: 0;
  width: 28px; height: 28px;
  border-radius: var(--r-sm);
  transition: all var(--d-fast) var(--ease);
  display: grid;
  place-items: center;
}
.modal__close:hover{ background: var(--surface-2); color: var(--text); }
.modal h2{
  font-family: var(--f-display);
  font-variation-settings: 'opsz' 32;
  font-size: 22px;
  font-weight: 500;
  margin: 0 0 var(--sp-3) 0;
  letter-spacing: -0.015em;
}

/* ─── Edit form ──────────────────────────────────────────── */
.editform .grid-2{ grid-template-columns: 1fr 1fr; gap: var(--sp-2); }
.editform .field{ margin-bottom: var(--sp-2); }

/* ─── Toast ──────────────────────────────────────────────── */
/* Persistent "What just happened" banner — sits below the topbar, stays
   until dismissed. Meant to survive long enough for the operator to read
   the effect of their save (unlike the toast which fades in 3.5s). */
.last-action{
  display: flex;
  align-items: flex-start;
  gap: 12px;
  margin: 12px auto;
  max-width: 1200px;
  padding: 12px 16px;
  background: #F0FDF4;
  border: 1px solid #BBF7D0;
  border-left: 4px solid #059669;
  border-radius: var(--r-sm, 8px);
  color: #064E3B;
  font-size: 14px;
  line-height: 1.5;
}
.last-action__body { flex: 1 1 auto; }
.last-action__close {
  background: transparent; border: 0; cursor: pointer;
  color: #064E3B; font-size: 18px; line-height: 1;
  padding: 2px 6px; border-radius: 4px;
}
.last-action__close:hover { background: rgba(6, 78, 59, 0.08); }
.last-action.last-action--err{ background:#FEF2F2; border-color:#FECACA; border-left-color:#DC2626; color:#7F1D1D; }
.last-action.last-action--err .last-action__close{ color:#7F1D1D; }

.toast{
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: var(--ink);
  color: var(--paper);
  padding: 10px 18px;
  border-radius: var(--r-sm);
  font-size: 13px;
  font-weight: 500;
  z-index: 1000;
  opacity: 0;
  transition: opacity var(--d-base) var(--ease), transform var(--d-base) var(--ease);
  pointer-events: none;
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 8px;
  max-width: 480px;
}
.toast::before{
  content: '';
  width: 3px; height: 14px;
  background: var(--ember);
  border-radius: 1px;
}
.toast.show{
  opacity: 1;
  transform: translateX(-50%) translateY(0);
  pointer-events: auto;
}
.toast--ok::before{ background: var(--mint); }
.toast--err::before{ background: var(--rust); }
.toast--warn::before{ background: var(--amber); }

/* ─── Alerts ─────────────────────────────────────────────── */
.alert{
  padding: var(--sp-2) var(--sp-3);
  border-radius: var(--r-sm);
  font-size: 13px;
  border-left: 2px solid;
  margin-bottom: var(--sp-3);
}
.alert--info{ background: var(--ember-wash); color: var(--ember); border-color: var(--ember); }
.alert--ok{ background: var(--mint-wash); color: var(--mint); border-color: var(--mint); }
.alert--err{ background: var(--rust-wash); color: var(--rust); border-color: var(--rust); }

/* ─── Hint / helper text ─────────────────────────────────── */
.hint{ font-size: 12px; color: var(--text-muted); margin-top: var(--sp-1); }
.mt-2{ margin-top: var(--sp-2); }

/* ─── Loading ────────────────────────────────────────────── */
@keyframes pulse{
  0%, 100%{ opacity: 1; }
  50%{ opacity: 0.5; }
}
.is-loading{ animation: pulse 1.4s var(--ease) infinite; }

/* ─── Number animation (count-up via CSS var, fallback) ──── */
.kpi__value.animate-in{
  animation: kpiIn var(--d-slow) var(--ease);
}
@keyframes kpiIn{
  from { opacity: 0; transform: translateY(8px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ─── Responsive ─────────────────────────────────────────── */
@media (max-width: 900px){
  .panel{ padding: var(--sp-3); }
  .panel__title{ font-size: 26px; }
  .grid-2, .grid-3{ grid-template-columns: 1fr; }
  .tab{ padding: 14px 14px; font-size: 12px; }
  .kpi__value{ font-size: 28px; }
  .app__topbar{ padding: 10px 16px; }
}

/* ─── Print ──────────────────────────────────────────────── */
@media print{
  .app__topbar, .tabs, .theme-toggle, .btn, .filterbar{ display: none !important; }
  .card{ box-shadow: none; border-color: var(--ink); }
  body{ background: white; color: black; }
  .panel.is-active{ animation: none; }
}

/* ─── Reduced motion ─────────────────────────────────────── */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}

/* ─── Container (compat with old pages) ──────────────────── */
.container { max-width: 1100px; margin: 0 auto; padding: var(--sp-4); }
.container--wide{ max-width: 1600px; }
.container--narrow{ max-width: 760px; }

/* ─── Misc compat (kept for existing forms in ExpenseForm/OwnerTransaction) ─── */
.hidden{ display: none !important; }
.badge{
  display: inline-block;
  padding: 2px 8px;
  background: var(--surface-2);
  color: var(--text-muted);
  border-radius: var(--r-sm);
  font-size: 11px;
  font-weight: 500;
}
.btn--lg{ padding: 12px 22px; font-size: 14px; min-height: 44px; }
.btn--block{ display: flex; width: 100%; }
.btn--secondary{ background: var(--surface-2); color: var(--text); border-color: var(--rule); }
.btn--warm{ background: var(--ember); color: white; border-color: var(--ember); }
.btn--sm{ padding: 6px 14px; font-size: 12px; min-height: 32px; }
.warn-existing{ display: none; padding: var(--sp-2); background: var(--amber-wash); color: var(--amber); border-radius: var(--r-sm); margin: var(--sp-2) 0; font-size: 12px; }
.warn-existing.show, #warn:not([style*="display: none"]){ display: block; }
.seg{ display: inline-flex; gap: 0; border: 1px solid var(--rule); border-radius: var(--r-md); overflow: hidden; margin-bottom: var(--sp-3); }
.seg button{ padding: 7px 14px; background: var(--surface); color: var(--text-muted); border: none; cursor: pointer; font-size: 13px; }
.seg button.on, .seg button.is-active{ background: var(--surface-2); color: var(--text); font-weight: 600; }
.tbl{ width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th{ background: var(--surface-2); padding: 8px 10px; text-align: left; font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.08em; }
.tbl td{ padding: 8px 10px; border-bottom: 1px solid var(--pencil-soft); }
.addgrid{ display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: var(--sp-2); margin-bottom: var(--sp-2); }
.il{ padding: 7px 10px; border: 1px solid var(--rule); border-radius: var(--r-sm); font-family: var(--f-body); font-size: 13px; background: var(--surface); color: var(--text); }
.il:focus{ border-color: var(--ember); outline: none; box-shadow: var(--ring); }
.pane{ display: none; }
.pane.on, .pane.is-active{ display: block; }
.adv-panel{ display: none; padding: var(--sp-2); background: var(--ember-wash); border-radius: var(--r-sm); margin-bottom: var(--sp-3); font-size: 12px; }
.adv-panel.show, .adv-panel:not([style*="display: none"]){ display: block; }
.preview-lbl{ font-size: 10px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.1em; }
.preview-val{ font-family: var(--f-display); font-variation-settings: 'opsz' 90; font-size: 36px; font-weight: 500; margin-top: var(--sp-1); letter-spacing: -0.02em; }
.pb{ display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--pencil-soft); font-size: 13px; }
.pb-l{ color: var(--text-muted); }
.pb-v{ font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.pb-v--sub{ color: var(--rust); }
.pb-v--add{ color: var(--mint); }

/* ─── Charts ─────────────────────────────────────────────── */
.chart-wrap{ width: 100%; overflow: hidden; max-height: 320px; }
.chart-wrap svg{ display: block; max-width: 100%; max-height: 320px; }
.chart-wrap--donut{ max-height: 280px; }
.chart-wrap svg{ display: block; max-width: 100%; height: auto; }
.chart-lbl{
  font-family: var(--f-body);
  font-size: 12px;
  font-weight: 500;
  fill: var(--text-soft);
}
.chart-val{
  font-family: var(--f-mono);
  font-size: 11px;
  font-weight: 600;
  fill: var(--text);
}
.chart-empty{
  padding: var(--sp-5) var(--sp-3);
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}
.chart-donut{
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  flex-wrap: wrap;
}
.chart-donut svg{ flex-shrink: 0; }
.chart-donut__total{
  font-family: var(--f-display);
  font-variation-settings: 'opsz' 32;
  font-size: 18px;
  font-weight: 600;
  fill: var(--text);
}
.chart-donut__cap{
  font-family: var(--f-body);
  font-size: 9px;
  font-weight: 600;
  fill: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.1em;
}
.chart-legend{ flex: 1 1 200px; min-width: 0; display: grid; gap: 6px; }
.chart-legend__item{
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
}
.chart-legend__dot{ width: 10px; height: 10px; border-radius: 2px; flex-shrink: 0; }
.chart-legend__lbl{ color: var(--text-soft); flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chart-legend__val{ font-family: var(--f-mono); font-size: 11px; color: var(--text-muted); flex-shrink: 0; }

/* ─── Fund transfer preview ──────────────────────────────── */
.ft-preview{ padding: var(--sp-2) 0; }
.ft-preview__type{ font-size: 13px; margin-bottom: var(--sp-2); }
.ft-preview__flow{
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  flex-wrap: wrap;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
}
.ft-preview__arrow{ color: var(--ember); font-weight: 700; font-size: 16px; }
.ft-preview__amt{
  font-family: var(--f-display);
  font-variation-settings: 'opsz' 90;
  font-size: 28px;
  font-weight: 500;
  margin-top: var(--sp-2);
  letter-spacing: -0.02em;
}

/* ─── Monthly Close form ─────────────────────────────────── */
.mc-auto-tag{
  display:inline-block; margin-left:6px; padding:1px 6px;
  background:var(--teal); color:#fff; border-radius:3px;
  font-size:9px; font-weight:600; letter-spacing:.05em; text-transform:uppercase;
  vertical-align:middle;
}
.mc-readout{
  background: var(--surface-2);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  padding: var(--sp-2) var(--sp-3);
  margin-top: var(--sp-2);
}
.mc-readout__row{
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  font-size: 13px;
}
.mc-readout__row + .mc-readout__row{ border-top: 1px solid var(--rule); }
.mc-readout__row--strong{ font-weight: 600; font-size: 14px; padding-top: 6px; padding-bottom: 6px; }
.mc-readout__row .mc-add{ color: var(--mint); }
.mc-readout__row .mc-sub{ color: var(--rust); }
.mc-step{
  display: inline-flex; align-items: center; gap: 8px;
  padding: 6px 12px; background: var(--surface);
  border: 1px solid var(--rule); border-radius: var(--r-sm);
  text-decoration: none; color: var(--text-muted);
  font-size: 12px; font-weight: 500;
  font-family: var(--f-body);
  cursor: pointer;
  transition: all var(--d-fast) var(--ease);
}
.mc-step:hover{ color: var(--text); border-color: var(--ember); }
.mc-step__n{
  display:inline-grid; place-items:center;
  width:20px; height:20px; border-radius:50%;
  background: var(--blue); color: #fff;
  font-weight: 700; font-size:11px;
}
.mc-step__t{ font-weight: 600; }
.input[readonly]{ background: var(--surface-2); cursor: default; }

/* ─── Autocomplete dropdown (party name) ─────────────────── */
.field--autocomplete{ position: relative; }
.autocomplete-list{
  position: absolute;
  top: 100%; left: 0; right: 0;
  background: var(--surface);
  border: 1px solid var(--rule);
  border-radius: var(--r-sm);
  box-shadow: var(--shadow-md);
  max-height: 260px;
  overflow-y: auto;
  z-index: 100;
  margin-top: 2px;
}
.ac-item{
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid var(--rule);
  transition: background var(--d-fast) var(--ease);
}
.ac-item:last-child{ border-bottom: none; }
.ac-item:hover{ background: var(--surface-2); }
.ac-item__main{ display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
